name: CI — Tests y Linting
# ⚠️ Pipeline informativo — ningún paso bloquea el merge.
# Los resultados se muestran como checks de referencia en el PR.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # El job nunca falla aunque algún paso tenga errores
    continue-on-error: true

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Instalar dependencias
        run: uv sync --extra dev
        continue-on-error: true

      - name: Verificar formato con Black
        run: uv run black --check src/ tests/ train.py compare_results.py
        continue-on-error: true

      - name: Linting con Flake8
        run: |
          uv run flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 src/ tests/ --count --exit-zero --max-line-length=100 --statistics
        continue-on-error: true

      - name: Correr tests
        run: |
          uv run pytest tests/test_data.py tests/test_metrics.py -v \
            --cov=src --cov-report=term-missing \
            -k "not TestModelBuilders"
        continue-on-error: true

      - name: Verificar que configs son YAML válidos
        run: |
          uv run python -c "
          import yaml, pathlib
          for f in pathlib.Path('configs').rglob('*.yaml'):
              with open(f) as fp:
                  yaml.safe_load(fp)
              print(f'OK: {f}')
          "
        continue-on-error: true
