name: CI

# Se ejecuta cuando alguien sube código o abre un Pull Request.
# Es solo informativo — no bloquea el merge aunque algo falle.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    continue-on-error: true   # nunca bloquea el merge

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install pyyaml scikit-learn numpy pytest
        continue-on-error: true

      - name: Correr tests básicos
        run: pytest tests/test_data.py tests/test_metrics.py -v
        continue-on-error: true

      - name: Verificar que los YAML de config son válidos
        run: |
          python -c "
          import yaml, pathlib
          for f in pathlib.Path('configs').rglob('*.yaml'):
              yaml.safe_load(open(f))
              print('OK:', f)
          "
        continue-on-error: true
