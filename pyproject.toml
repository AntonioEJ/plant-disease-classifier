[project]
name = "plant-disease-classifier"
version = "1.0.0"
description = "Clasificación binaria de enfermedades en hojas de plantas con transfer learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.12.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "kaggle>=1.5.16",
    "tqdm>=4.65.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.8.0",
    "tensorboard>=2.12.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
train = "train:main"
compare = "compare_results:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
